name: Validation

# Run only when code, test data, or dependencies change
on:
  push:
    branches: [ main ]
    paths: &paths
      - "buildings/**"
      - "!buildings/_explore/**"
      - "!buildings/_review/**"
      - "!buildings/_validate/**"
      - "!**/*.md"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/validate.yaml"
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # hard stop on a hung download

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # must satisfy requires-python
        cache: pip
        cache-dependency-path: requirements.txt

    # The fast tests use synthetic data only, so there is no downloaded test
    # data to cache. Add an actions/cache step here if networked tests are added.

    - name: Install packages
      run: |
        pip install --upgrade pip
        pip install . pytest pylint   # non-editable: catches missing package-data

    - name: Check manifest
      run: python .github/check_manifest.py

    - name: Analyse code
      run: |
        cd buildings
        pylint --fail-under 0 *.py

    - name: Run tests
      run: |
        pytest --durations=10
