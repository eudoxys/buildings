[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buildings"]

[tool.setuptools.package-data]
# list every file pattern the package reads at run time
buildings = ["*.py"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "buildings"
version = "0.0.0" # 0.0.0 = unreleased (hidden by `epm index`)
description = "US building inventory"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = "== 3.12.*" # must match the CI python version
keywords = ["eudoxys","python","US","building","inventory"] # "eudoxys" marks an official Eudoxys release
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/buildings"
Documentation = "https://www.eudoxys.com/buildings"
Repository = "https://github.com/eudoxys/buildings.git"
Issues = "https://github.com/eudoxys/buildings/issues"

[project.scripts]
buildings = "buildings.cli:main"

[tool.pytest.ini_options]
testpaths = ["buildings/_test"]
markers = [
    "network: downloads external data (slow on an empty cache)",
    ]
